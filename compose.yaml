name: weapon-quiz

services:
  django:
    image: django
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8082:8000"

    command: runserver

  mysql:
    image: mysql:8
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - LANG=ru_RU.UTF-8
      - MYSQL_ALLOW_EMPTY_PASSWORD=1

volumes:
  mysql-data:
